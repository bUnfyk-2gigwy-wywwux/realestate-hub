# ============================================================
# Streamlit 앱 수면 방지 v2 (브라우저 로드 방식)
# 위치: .github/workflows/keepalive.yml  ← 기존 파일 교체
# 동작: 하루 3회 실제 브라우저(Chromium)로 앱 방문
#       → 실방문 트래픽으로 수면 차단 + 잠든 앱은 버튼 자동 클릭으로 깨움
# 실행 시각(KST): 09:00 / 17:00 / 01:00
# ============================================================
name: Streamlit Keep-Alive

on:
  schedule:
    - cron: "0 0,8,16 * * *"   # UTC 기준 (KST -9시간)
  workflow_dispatch:            # 수동 실행 버튼 (테스트용)

# WHY: GitHub 은 저장소에 60일간 커밋이 없으면 예약 워크플로를 자동으로 끈다
#      (2026-10-13 실제로 꺼져 5주간 앱 4개가 방치됨). 아래 마지막 스텝이 30일마다
#      표식 파일을 커밋해 이를 막는다. 그 커밋에 contents: write 권한이 필요하다.
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit apps (wake if sleeping)
        run: |
          python - <<'PYEOF'
          from playwright.sync_api import sync_playwright

          URLS = [
              # 옛 진단기 주소(realestate-risk-screener…)는 2026-11-18 실행에서 "Not found" — 삭제.
              "https://gyeyang-tax.streamlit.app",
              "https://gyeyang-avm.streamlit.app",
              "https://sanggwon-lab.streamlit.app",
              "https://sajeon-jindan.streamlit.app",   # SNS 프로필에 걸린 진단기 주소
              # 추후 배포 시 주석 해제 후 URL 입력
              # "https://TODO-경매레이더.streamlit.app",
          ]

          failed = []
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              for url in URLS:
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=120000)
                      page.wait_for_timeout(8000)  # 앱 로드 대기
                      wake = page.get_by_text("get this app back up", exact=False)
                      if wake.count() > 0:
                          wake.first.click()
                          print(f"[WAKE] {url} — 수면 상태 발견, 깨우기 클릭 후 60초 대기")
                          page.wait_for_timeout(60000)
                          print(f"[WAKE-DONE] {url} — 제목: {page.title()}")
                      # WHY: 없는 주소도 Streamlit 이 "Not found" 페이지를 정상 응답으로 돌려줘
                      #      종전에는 [OK] 로 찍혔다. 제목으로 구분해 실패로 센다.
                      elif "not found" in page.title().lower():
                          print(f"[ERR] {url} — 앱 없음(제목: {page.title()})")
                          failed.append(url)
                      else:
                          print(f"[OK] {url} — 정상 가동 중 (제목: {page.title()})")
                      page.wait_for_timeout(5000)  # 방문 세션 유지
                  except Exception as e:
                      print(f"[ERR] {url} — {type(e).__name__}: {e}")
                      failed.append(url)
              browser.close()
          print("완료")
          # WHY: 앱이 안 열려도 초록 체크로 끝나면 아무도 모른다. 실패가 있으면 실행을 실패로 끝낸다.
          if failed:
              raise SystemExit(f"실패 {len(failed)}건: {', '.join(failed)}")
          PYEOF

      # WHY: 매 실행마다 커밋하면 Pages 재배포가 하루 3번 돈다. 마지막 커밋이 30일을 넘겼을 때만
      #      표식 파일을 갱신한다(60일 자동 중단 기준의 절반).
      - name: 60일 자동 중단 방지(30일마다 표식 커밋)
        if: always()
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "마지막 커밋 ${AGE_DAYS}일 전"
          if [ "$AGE_DAYS" -lt 30 ]; then echo "30일 미만 — 커밋 생략"; exit 0; fi
          date -u +"%Y-%m-%d %H:%M UTC" > .github/keepalive_last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive_last_run.txt
          git commit -m "chore: keepalive $(date -u +%F)"
          git push || { echo "::error::표식 커밋 푸시 실패 — 60일 뒤 워크플로가 다시 꺼질 수 있습니다."; exit 1; }
